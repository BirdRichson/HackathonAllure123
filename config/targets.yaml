# Целевые показатели завода.
# Источник: «Дополнительные вводные» тестовых данных организаторов (05.10.2026).
# Пороги цвета/предупреждений помечены как допущения — их можно менять.

oee_min: 0.85                           # данные: целевой OEE не менее 85%
defect_rate_max: 0.02                   # данные: допустимый брак не более 2%
critical_downtime_max_min_per_day: 60   # данные: макс. простой критического оборудования, мин/сутки
monthly_output_min: 5500                # данные: план выпуска не менее 5 500 авто/месяц

# Пороги для цветовой индикации (допущения проекта)
oee_red_below: 0.75                     # OEE ниже 75% — красный, 75–85% — жёлтый
critical_downtime_warn_min: 45          # 75% лимита — предупреждение
