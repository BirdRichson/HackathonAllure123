# Модель завода для цифрового двойника.
# Источник: тестовые данные организаторов (05.10.2026) и решения D1–D11 (docs/TEST_DATA.md).
# source: data        — значение есть в данных организаторов
# source: assumption  — допущение проекта (в интерфейсе помечается как «допущение модели»)
# Параметры отказов, ремонтов и телеметрии добавляются на этапе 1 (симулятор).

meta:
  name: "Автозавод АЛЛЮР — модель по тестовым данным"
  timezone: "+05:00"

schedule:
  shifts_per_day: 2                 # data
  shift_hours: 8                    # data
  shifts:                           # assumption: время начала смен
    - { id: 1, start: "08:00", end: "16:00" }
    - { id: 2, start: "16:00", end: "00:00" }
  working_weekdays: [1, 2, 3, 4, 5] # D10: пн–пт, 22 рабочих дня в месяце

rates:
  plan_units_per_shift: 120         # data (D1): план на линию за смену
  takt_min: 4.0                     # 480 мин / 120 — плановый такт
  ideal_cycle_min: 3.8              # D2: паспортный идеальный цикл для расчёта OEE

models:                             # data: месячный план по моделям (D6 — смешанный поток)
  - { id: ONIX,   name: "Chevrolet Onix",   plan_month_units: 2500 }
  - { id: COBALT, name: "Chevrolet Cobalt", plan_month_units: 1800 }
  - { id: J7,     name: "JAC J7",           plan_month_units: 500 }

flow: [WH, WELD, PAINT, ASSY, QC, FG] # data: схема участков

areas:
  - { id: WH,    name: "Склад комплектующих",       line_id: null,        source: data }
  - { id: WELD,  name: "Сварка",                    line_id: "Сварка-1",  source: data }
  - { id: PAINT, name: "Окраска",                   line_id: "Окраска-1", source: data }
  - { id: ASSY,  name: "Сборка",                    line_id: "Сборка-1",  source: data }
  - { id: QC,    name: "Контроль качества",         line_id: null,        source: data }
  - { id: FG,    name: "Склад готовой продукции",   line_id: null,        source: data }

buffers:                            # assumption: ёмкость буферов между участками, кузовов
  - { from: WH,    to: WELD,  capacity: null, note: "запас CKD-комплектов задаётся в часах на этапе 1" }
  - { from: WELD,  to: PAINT, capacity: 12 }
  - { from: PAINT, to: ASSY,  capacity: 15 }
  - { from: ASSY,  to: QC,    capacity: 8 }

# id — ASCII для кода и API; name — название как в данных организаторов (показывается в интерфейсе).
# critical — D5: оборудование, остановка которого останавливает линию.
equipment:
  - { id: ABB-01,  name: "ABB-01",          area: WELD,  type: robot,      critical: true, source: data }
  - { id: ABB-02,  name: "ABB-02",          area: WELD,  type: robot,      critical: true, source: assumption }
  - { id: ABB-03,  name: "ABB-03",          area: WELD,  type: robot,      critical: true, source: assumption }
  - { id: ABB-04,  name: "ABB-04",          area: WELD,  type: robot,      critical: true, source: data }
  - { id: CAM-01,  name: "Камера-01",       area: PAINT, type: paint_booth, critical: true, source: assumption }
  - { id: CAM-02,  name: "Камера-02",       area: PAINT, type: paint_booth, critical: true, source: data }
  - { id: OVEN-01, name: "Печь сушки",      area: PAINT, type: oven,       critical: true, source: assumption }
  - { id: CONV-01, name: "Конвейер-01",     area: ASSY,  type: conveyor,   critical: true, source: assumption }
  - { id: CONV-02, name: "Конвейер-02",     area: ASSY,  type: conveyor,   critical: true, source: assumption }
  - { id: CONV-03, name: "Конвейер-03",     area: ASSY,  type: conveyor,   critical: true, source: data }
  - { id: QC-01,   name: "Стенд геометрии", area: QC,    type: test_stand, critical: false, source: assumption }
  - { id: QC-02,   name: "Стенд герметичности", area: QC, type: test_stand, critical: false, source: assumption }

# ─────────────────────────────────────────────────────────────────────────────
# Параметры симулятора (этап 1). Всё ниже — допущения модели (source: assumption),
# откалиброванные так, чтобы смены выглядели как в тестовых данных организаторов:
# факт 110–121 за смену, время работы 7,2–8,0 ч, брак сварка ≈2%, окраска ≈4%, сборка ≈1%.
# ─────────────────────────────────────────────────────────────────────────────

simulation:
  seed: 42
  history_days: 60
  history_end: "2026-09-30"        # история за 60 суток до начала периода тестовых данных
  telemetry_step_min: 1
  maintenance_window: in_shift     # как сейчас на заводе (ТО ABB-04 — в смену). Альтернатива: night

supply:                            # склад CKD-комплектов
  initial_stock: 420
  delivery_time: "06:00"
  delivery_units: 250
  delivery_weekdays: [1, 2, 3, 4, 5]

process:                           # циклы участков, мин; брак — базовая вероятность на кузов
  WELD:  { cycle_min: 3.90, cycle_cv: 0.025, defect_rate: 0.020, defect_codes: { WELD_SPOT: 0.6, WELD_GEOM: 0.4 } }
  PAINT: { cycle_min: 3.92, cycle_cv: 0.025, defect_rate: 0.023, defect_codes: { PAINT_RUN: 0.45, PAINT_ORANGE: 0.35, PAINT_DIRT: 0.20 } }
  ASSY:  { cycle_min: 3.88, cycle_cv: 0.025, defect_rate: 0.011, defect_codes: { ASSY_GAP: 0.6, ASSY_TORQUE: 0.4 } }
  QC:    { cycle_min: 3.80, cycle_cv: 0.030, defect_rate: 0.0,   defect_codes: {} }

changeover:                        # переналадка сварки при смене модели
  area: WELD
  minutes: [3, 7]
  batch_size: [40, 80]             # кузовов одной модели подряд

micro_stops:                       # короткие остановки, которые обычно не записывают
  mean_interval_min: 150
  minutes: [1, 3]
  report_probability: 0.05

defect_names:
  WELD_SPOT: "Непровар сварной точки"
  WELD_GEOM: "Отклонение геометрии кузова"
  PAINT_RUN: "Подтёк ЛКП"
  PAINT_ORANGE: "Шагрень"
  PAINT_DIRT: "Сорность (включения)"
  ASSY_GAP: "Зазоры и перепады"
  ASSY_TORQUE: "Момент затяжки"

# Типы оборудования: нормальная телеметрия [среднее, ст. откл.], плановое ТО, режимы отказов.
# weibull.scale_h — характерная наработка в моточасах; shape > 1 — износ, = 1 — случайные сбои.
# precursor — предвестник: за lead_min моточасов до отказа сигналы плавно растут (доля прироста к норме).
equipment_types:
  robot:
    telemetry: { temperature: [45.0, 1.2], vibration: [1.2, 0.12], current: [8.0, 0.35] }
    maintenance: { interval_h: 160, duration_min: 30, renews_wear: true }
    failure_modes:
      - id: sensor_error
        reason: breakdown
        reason_text: "Ошибка датчика"
        subtype: "датчик"
        weibull: { shape: 1.0, scale_h: 70 }
        repair_min: { median: 24, sigma: 0.35 }
        precursor: null

  paint_booth:
    telemetry: { temperature: [23.0, 0.35], vibration: [0.8, 0.08], current: [15.0, 0.4] }
    maintenance: { interval_h: 160, duration_min: 40, renews_wear: true }
    filter:
      dp_new_pa: 120
      dp_limit_pa: 450              # при достижении — вынужденная остановка на замену
      dp_defect_from_pa: 300        # выше — растёт сорность
      defect_rate_at_limit: 0.100   # добавка к браку окраски при dp = предел
      life_h: [125, 25]             # наработка фильтра до засорения, моточасы [среднее, ст. откл.]
      replace_min: { median: 40, sigma: 0.12 }
      reason: consumables
      reason_text: "Замена фильтра"
      subtype: "фильтр"
    failure_modes: []

  oven:
    telemetry: { temperature: [160.0, 1.2], vibration: [0.6, 0.06], current: [22.0, 0.6] }
    maintenance: { interval_h: 240, duration_min: 30, renews_wear: true }
    failure_modes:
      - id: burner_fault
        reason: breakdown
        reason_text: "Сбой горелки печи"
        subtype: "горелка"
        weibull: { shape: 1.5, scale_h: 420 }
        repair_min: { median: 35, sigma: 0.3 }
        precursor: { lead_min: [30, 90], temperature_std_x: 4.0 }

  conveyor:
    telemetry: { temperature: [40.0, 0.8], vibration: [2.0, 0.18], current: [12.0, 0.35] }
    maintenance: { interval_h: 200, duration_min: 30, renews_wear: true }
    failure_modes:
      - id: chain_break
        reason: breakdown
        reason_text: "Обрыв цепи"
        subtype: "цепь"
        weibull: { shape: 3.0, scale_h: 260 }
        repair_min: { median: 50, sigma: 0.2 }
        precursor: { lead_min: [60, 180], current: 0.35, vibration: 1.5 }

  test_stand:
    telemetry: { temperature: [30.0, 0.5], vibration: [0.4, 0.05], current: [3.0, 0.15] }
    maintenance: { interval_h: 300, duration_min: 20, renews_wear: true }
    failure_modes:
      - id: calibration_fault
        reason: breakdown
        reason_text: "Сбой калибровки стенда"
        subtype: "калибровка"
        weibull: { shape: 1.0, scale_h: 500 }
        repair_min: { median: 15, sigma: 0.3 }
        precursor: null

live:                              # живой режим для демо
  start_date: "2026-10-05"         # день завода в демо — один и тот же, чтобы цифры совпадали с презентацией;
                                   # null — последний рабочий день по часам компьютера; ALLUR_LIVE_START — переопределить
  start_time: "10:30"              # время завода при запуске
  warmup_days: 30                  # сколько суток «прожить» до старта — история для графиков и Парето
  speeds: [1, 10, 60, 300]
  default_speed: 10
  telemetry_window_h: 24           # сколько часов телеметрии держать в памяти
  tick_s: 0.5                      # шаг обновления живого потока, секунды реального времени
